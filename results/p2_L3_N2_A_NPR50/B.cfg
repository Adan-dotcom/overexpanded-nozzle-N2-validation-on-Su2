% DLR-PAR Phase 1 in SU2: cold N2, NPR=50, wall A (adiabatic), L0 grid identical
% to Eilmer Run 2.  Numerics copied from the previous campaign's final
% npr20_final_validation_bdf2.cfg (SLAU2, MUSCL, Venkat-Wang 0.001, pseudo-CFL 2,
% 30 inner); start-up stage mirrors its BDF1/first-order transfer.
% Changes vs that file: N2 ideal gas, P0/T0/p_amb, plain SST V2003m (spec:
% Menter SST, no Sarkar), OUTLET marker, reservoir-fill seed, dt.
SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
READ_BINARY_RESTART= YES
RESTART_ITER= 4
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= 5.0e-8
TIME_ITER= 30001
INNER_ITER= 30
AXISYMMETRIC= YES
%
MACH_NUMBER= 0.001
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0
FREESTREAM_TURBULENCEINTENSITY= 0.01
FREESTREAM_TURB2LAMVISCRATIO= 10.0
REF_DIMENSIONALIZATION= DIMENSIONAL
%
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 296.8
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.663E-5
MU_T_REF= 273.0
SUTHERLAND_CONSTANT= 107.0
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
TURBULENT_CONDUCTIVITY_MODEL= CONSTANT_PRANDTL_TURB
PRANDTL_TURB= 0.90
%
MARKER_HEATFLUX= ( WALL, 0.0 )
MARKER_EULER= ( SHROUD )
MARKER_SYM= ( AXIS )
MARKER_RIEMANN= ( INLET, TOTAL_CONDITIONS_PT, 5066250.0, 300.0, 1.0, 0.0, 0.0 )
MARKER_FAR= ( FARFIELD )
MARKER_OUTLET= ( OUTLET, 101325.0 )
MARKER_MONITORING= ( WALL )
MARKER_PLOTTING= ( WALL )
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 2.0
CFL_ADAPT= NO
MAX_DELTA_TIME= 1E6
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
MUSCL_TURB= NO
SLOPE_LIMITER_TURB= NONE
VENKAT_LIMITER_COEFF= 0.001
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 10
CONV_NUM_METHOD_FLOW= SLAU2
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_REDUCTION_TURB= 0.5
CONV_RESIDUAL_MINVAL= -12
CONV_STARTITER= 5
%
MESH_FILENAME= mesh_L3.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= restart
RESTART_FILENAME= restart
CONV_FILENAME= history_B
VOLUME_FILENAME= flow
SURFACE_FILENAME= wall
OUTPUT_FILES= ( RESTART, CSV, SURFACE_CSV )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
OUTPUT_WRT_FREQ= 2500, 2500, 50
HISTORY_WRT_FREQ_INNER= 10
HISTORY_WRT_FREQ_OUTER= 1
HISTORY_WRT_FREQ_TIME= 1
SCREEN_WRT_FREQ_INNER= 30
SCREEN_WRT_FREQ_TIME= 100
SCREEN_OUTPUT= ( TIME_ITER, CUR_TIME, INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION )
HISTORY_OUTPUT= ( ITER, RMS_RES, TIME_DOMAIN )
