% DLR-PAR steady RANS (cold N2), same physics/BCs as the validated Phase-1
% unsteady case; only the time integration differs (pseudo-time to steady state).
% Startup controls (first-order, low CFL, CFL_ADAPT) follow the previous
% campaign's npr20_startup.cfg; production controls follow its final cfg.
SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m
MATH_PROBLEM= DIRECT
RESTART_SOL= @RESTART_SOL@
READ_BINARY_RESTART= @READ_BINARY@
TIME_DOMAIN= NO
ITER= @ITER@
AXISYMMETRIC= YES
%
MACH_NUMBER= 0.001
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= @P_AMB@
FREESTREAM_TEMPERATURE= @T_AMB@
FREESTREAM_TURBULENCEINTENSITY= 0.01
FREESTREAM_TURB2LAMVISCRATIO= 10.0
REF_DIMENSIONALIZATION= DIMENSIONAL
%
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 296.8
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.663E-5
MU_T_REF= 273.0
SUTHERLAND_CONSTANT= 107.0
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
TURBULENT_CONDUCTIVITY_MODEL= CONSTANT_PRANDTL_TURB
PRANDTL_TURB= 0.90
%
MARKER_HEATFLUX= ( WALL, 0.0 )
MARKER_EULER= ( SHROUD )
MARKER_SYM= ( AXIS )
MARKER_RIEMANN= ( INLET, TOTAL_CONDITIONS_PT, @P0@, @T0@, 1.0, 0.0, 0.0 )
MARKER_FAR= ( FARFIELD )
MARKER_OUTLET= ( OUTLET, @P_AMB@ )
MARKER_MONITORING= ( WALL )
MARKER_PLOTTING= ( WALL )
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= @CFL@
CFL_ADAPT= @CFL_ADAPT@
CFL_ADAPT_PARAM= ( 0.5, 1.05, @CFL_MIN@, @CFL_MAX@ )
MUSCL_FLOW= @MUSCL@
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
MUSCL_TURB= NO
SLOPE_LIMITER_TURB= NONE
VENKAT_LIMITER_COEFF= @VENKAT@
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 10
CONV_NUM_METHOD_FLOW= SLAU2
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_REDUCTION_TURB= 0.5
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 50
%
MESH_FILENAME= @MESH@
MESH_FORMAT= SU2
SOLUTION_FILENAME= @SOLUTION@
RESTART_FILENAME= @RESTART@
CONV_FILENAME= history_@STAGE@
VOLUME_FILENAME= flow_@STAGE@
SURFACE_FILENAME= wall_@STAGE@
OUTPUT_FILES= ( RESTART, CSV, SURFACE_CSV )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
OUTPUT_WRT_FREQ= @WRT@, @WRT@, @WRT@
HISTORY_WRT_FREQ_INNER= 1
SCREEN_WRT_FREQ_INNER= 100
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION, LINSOL_ITER, CFL_NUMBER )
